services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    # ці значення важливіші за .env - в докері завжди продакшен-режим
    environment:
      DJANGO_DEBUG: "False"
      REDIS_URL: redis://redis:6379/1
      SQLITE_PATH: /app/data/db.sqlite3
      MEDIA_ROOT: /app/media
      SERVE_MEDIA: "True"
    # при старті застосовуємо міграції, потім запускаємо gunicorn
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data        # база не зникне після перезапуску
      - media_data:/app/media    # завантажені картинки теж
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  db_data:
  media_data:
